# Floor layout of the Nav2 warehouse world. Every pose is [x, y, yaw]
# (metres, radians) in the map frame. Picked with RViz "Publish Point" and
# tested with Nav2 follow_waypoints: all five places are reachable.
frame_id: map

stations:
  gtp_1:
    dock_pose: [-12.63, 2.61, 0.0]    # next to the wall, open space in front
    default_destination: sort_1
    auto_replenish: true              # always keep one AMR waiting here

destinations:
  sort_1:
    pose: [12.49, 1.80, 0.0]          # 25 m from the station

# Ready queue: one column below the delivery path (2.4 m or more off it),
# about 2 m between slots so each slot can be reached on its own.
queue_slots:
  q1:
    pose: [-4.88, -0.03, 0.0]
  q2:
    pose: [-4.91, -2.05, 0.0]
  q3:
    pose: [-4.82, -4.13, 0.0]