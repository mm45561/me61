# Floor layout for the fleet manager. Every pose is [x, y, yaw] (metres, radians)
# in `frame_id`, the map frame Nav2 localises in.
#
# These numbers are placeholders inside a 6 x 6 m room. Read the real ones from your
# map: in RViz use the "Publish Point" tool and `ros2 topic echo /clicked_point`.
#
# A robot only counts as having left a place once it is `clearance_m`
# (fleet_manager.yaml) away from it, so keep each dock, drop-off and slot more than
# that distance from the places robots drive to next.
frame_id: map

stations:
  gtp_1:
    dock_pose: [1.0, 2.0, 0.0]      # where the AMR stops beside the station
    default_destination: sort_1
    auto_replenish: true            # always keep one AMR waiting at this dock

destinations:
  sort_1:
    pose: [2.0, -2.0, -1.5708]
  sort_2:
    pose: [0.5, -2.0, -1.5708]

# Parking bays of the ready queue. Each bay must be reachable on its own (side by
# side, not a single-file lane): the fleet manager does not shuffle robots forward
# in a lane. There must be at least as many slots as robots.
queue_slots:
  q1:
    pose: [-2.0, 1.5, 0.0]
  q2:
    pose: [-2.0, 0.5, 0.0]
  q3:
    pose: [-2.0, -0.5, 0.0]
